<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D1A"/>
      <stop offset="55%" stop-color="#121935"/>
      <stop offset="100%" stop-color="#0D1128"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#33D6B0" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#33D6B0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="photo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B4E9C"/>
      <stop offset="100%" stop-color="#1D2757"/>
    </linearGradient>
    <linearGradient id="cardFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E3870"/>
      <stop offset="100%" stop-color="#232C58"/>
    </linearGradient>
    <filter id="dropshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="500" fill="url(#bg)"/>

  <!-- Ledger ruling: faint horizontal register lines -->
  <g stroke="#E8C468" stroke-width="1" opacity="0.055">
    <line x1="0" y1="52" x2="1200" y2="52"/>
    <line x1="0" y1="92" x2="1200" y2="92"/>
    <line x1="0" y1="132" x2="1200" y2="132"/>
    <line x1="0" y1="172" x2="1200" y2="172"/>
    <line x1="0" y1="212" x2="1200" y2="212"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="292" x2="1200" y2="292"/>
    <line x1="0" y1="332" x2="1200" y2="332"/>
    <line x1="0" y1="372" x2="1200" y2="372"/>
    <line x1="0" y1="412" x2="1200" y2="412"/>
    <line x1="0" y1="452" x2="1200" y2="452"/>
  </g>
  <!-- Ledger margin rule -->
  <line x1="58" y1="0" x2="58" y2="500" stroke="#D9534F" stroke-width="1.5" opacity="0.22"/>

  <!-- Ambient glow behind card stack -->
  <circle cx="900" cy="260" r="230" fill="url(#glow)"/>

  <!-- ================= Left: identity block ================= -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="82" y="112" font-size="15" letter-spacing="4" fill="#F2B705" font-weight="700">SMART ATTENDANCE · ZERO ROLL-CALL</text>

    <text x="80" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="98" font-weight="700" fill="#F5F1E8">Attendy</text>
    <rect x="83" y="240" width="200" height="4" fill="#F2B705"/>

    <text x="82" y="286" font-size="21" fill="#B9B6D6">AI-powered attendance for classrooms —</text>
    <text x="82" y="316" font-size="21" fill="#B9B6D6">face, voice and QR, verified in seconds.</text>

    <!-- Ledger-style feature columns -->
    <g transform="translate(82,382)">
      <g>
        <text font-size="13" letter-spacing="2" fill="#F2B705" font-weight="700">FACE</text>
        <text y="26" font-size="17" fill="#E9E7F5">Camera roll-call</text>
      </g>
      <line x1="150" y1="-16" x2="150" y2="34" stroke="#4A4E77" stroke-width="1" opacity="0.6"/>
      <g transform="translate(174,0)">
        <text font-size="13" letter-spacing="2" fill="#F2B705" font-weight="700">VOICE</text>
        <text y="26" font-size="17" fill="#E9E7F5">Spoken check-in</text>
      </g>
      <line x1="322" y1="-16" x2="322" y2="34" stroke="#4A4E77" stroke-width="1" opacity="0.6"/>
      <g transform="translate(346,0)">
        <text font-size="13" letter-spacing="2" fill="#F2B705" font-weight="700">QR</text>
        <text y="26" font-size="17" fill="#E9E7F5">Instant enrollment</text>
      </g>
    </g>
  </g>

  <!-- ================= Right: fanned ID-card stack ================= -->
  <g>
    <!-- back card -->
    <g transform="rotate(-13, 900, 255)">
      <rect x="770" y="90" width="250" height="330" rx="20" fill="#161C38"/>
    </g>
    <!-- mid card -->
    <g transform="rotate(-4, 900, 250)">
      <rect x="775" y="80" width="250" height="330" rx="20" fill="#1F2748"/>
    </g>

    <!-- front card -->
    <g transform="rotate(6, 905, 240)" filter="url(#dropshadow)">
      <rect x="782" y="65" width="250" height="330" rx="20" fill="url(#cardFront)" stroke="#F2B705" stroke-width="1.5" stroke-opacity="0.55"/>

      <!-- photo -->
      <circle cx="907" cy="160" r="52" fill="url(#photo)"/>
      <circle cx="907" cy="146" r="19" fill="#0D1128" opacity="0.55"/>
      <path d="M 869 196 Q 907 168 945 196 L 945 210 Q 907 188 869 210 Z" fill="#0D1128" opacity="0.55"/>

      <!-- scan line + glow -->
      <rect x="792" y="157" width="230" height="6" fill="#33D6B0" opacity="0.9" filter="url(#softglow)"/>
      <rect x="792" y="157" width="230" height="6" fill="#33D6B0"/>

      <!-- verified ribbon, top-right corner -->
      <path d="M 972 65 L 1032 65 L 1032 125 L 1002 105 L 972 125 Z" fill="#F2B705"/>
      <path d="M 990 92 L 998 100 L 1014 82" stroke="#1A1200" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- record skeleton lines -->
      <rect x="812" y="248" width="190" height="10" rx="5" fill="#F5F1E8" opacity="0.85"/>
      <rect x="812" y="272" width="130" height="8" rx="4" fill="#B9B6D6" opacity="0.6"/>
      <rect x="812" y="296" width="150" height="8" rx="4" fill="#B9B6D6" opacity="0.6"/>

      <!-- status chip -->
      <rect x="812" y="330" width="112" height="34" rx="17" fill="#33D6B0" opacity="0.14" stroke="#33D6B0" stroke-width="1.2"/>
      <circle cx="832" cy="347" r="5" fill="#33D6B0"/>
      <text x="846" y="352" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#CFF8EC" font-weight="700">VERIFIED</text>
    </g>

    <!-- small QR glyph anchoring the "instant enrollment" idea -->
    <g transform="translate(742,362)">
      <rect width="64" height="64" rx="8" fill="#0D1128" stroke="#4A4E77" stroke-width="1"/>
      <g fill="#F5F1E8">
        <rect x="8" y="8" width="16" height="16"/>
        <rect x="12" y="12" width="8" height="8" fill="#0D1128"/>
        <rect x="40" y="8" width="16" height="16"/>
        <rect x="44" y="12" width="8" height="8" fill="#0D1128"/>
        <rect x="8" y="40" width="16" height="16"/>
        <rect x="12" y="44" width="8" height="8" fill="#0D1128"/>
        <rect x="30" y="8" width="6" height="6"/>
        <rect x="30" y="30" width="6" height="6"/>
        <rect x="40" y="30" width="6" height="6"/>
        <rect x="30" y="40" width="6" height="6"/>
        <rect x="48" y="40" width="6" height="6"/>
        <rect x="40" y="48" width="6" height="6"/>
      </g>
    </g>
  </g>

  <!-- footer rule -->
  <rect x="0" y="494" width="1200" height="6" fill="#F2B705" opacity="0.55"/>
</svg>
